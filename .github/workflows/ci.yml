
name: CI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('CI manuelle sur {0}', github.ref_name)
      || format('CI sur {0}', github.ref_name) }}

on:
  push:
    branches-ignore:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. TESTS
  # ==========================================

  test:
    name: Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Exécuter les tests
        run: pytest -v

  # ==========================================
  # 2. FUSION AUTOMATIQUE VERS DEV
  # ==========================================

  merge-dev:
    name: Fusion automatique vers dev

    if: >-
      github.event_name == 'push'
      && github.ref != 'refs/heads/dev'

    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    concurrency:
      group: merge-dev
      cancel-in-progress: false

    steps:
      - name: Récupérer la branche dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fusionner la branche source dans dev
        id: merge
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$SOURCE_BRANCH" dev

          git checkout dev

          if git merge-base --is-ancestor "origin/$SOURCE_BRANCH" HEAD; then
            echo "Aucun nouveau commit à fusionner."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-ff \
            "origin/$SOURCE_BRANCH" \
            -m "Merge branch '$SOURCE_BRANCH' into dev"

          git push origin dev

          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Relancer la CI sur dev
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref dev

  # ==========================================
  # 3. BUILD ET PUBLICATION DOCKER HUB
  # ==========================================

  build:
    name: Build et publication Docker Hub

    if: >-
      github.ref == 'refs/heads/dev'
      && github.event_name != 'pull_request'

    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image Docker
        run: |
          docker build \
            -t "${{ vars.DOCKERHUB_USERNAME }}/frenchcab-backend:${{ github.sha }}" \
            -t "${{ vars.DOCKERHUB_USERNAME }}/frenchcab-backend:latest" \
            .

      - name: Publier l'image avec le SHA
        run: |
          docker push \
            "${{ vars.DOCKERHUB_USERNAME }}/frenchcab-backend:${{ github.sha }}"

      - name: Publier l'image latest
        run: |
          docker push \
            "${{ vars.DOCKERHUB_USERNAME }}/frenchcab-backend:latest"

      # ========================================
      # 4. DECLENCHEMENT EXPLICITE DE LA CD
      # ========================================

      - name: Déclencher la CD après publication Docker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Image publiée : ${{ vars.DOCKERHUB_USERNAME }}/frenchcab-backend:${GITHUB_SHA}"

          gh workflow run cd.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f image_sha="${GITHUB_SHA}"

          echo "Demande de déclenchement de la CD envoyée."
