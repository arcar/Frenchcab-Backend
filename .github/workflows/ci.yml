# .github/workflows/docker.yml

name: Build Docker image

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/frenchcab-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/frenchcab-backend:latest \
            .

      - name: Push vers Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frenchcab-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frenchcab-backend:latest