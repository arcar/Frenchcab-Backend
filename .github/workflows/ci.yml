
name: CI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('CI manuelle sur {0}', github.ref_name)
      || format('CI sur {0}', github.ref_name) }}

on:
  push:
    branches-ignore:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =====================================================
  # 1. TESTS DU BACKEND
  # =====================================================

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest -v

  # =====================================================
  # 2. FUSION AUTOMATIQUE DANS DEV
  # =====================================================

  merge-dev:
    name: Fusion automatique dans dev

    if: >-
      github.event_name == 'push'
      && github.ref != 'refs/heads/dev'

    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    concurrency:
      group: merge-dev
      cancel-in-progress: false

    steps:
      - name: Récupérer dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Merger la branche dans dev
        id: merge
        env:
          BRANCHE: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "Déjà présent dans dev, rien à merger"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-ff "$SHA" -m "<chores> merge auto de $BRANCHE dans dev"
          git push origin dev

          echo "merged=true" >> "$GITHUB_OUTPUT"

      # Un push avec GITHUB_TOKEN ne relance pas automatiquement
      # les workflows. Nous déclenchons donc la CI sur dev.
      - name: Relancer la CI sur dev
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref dev

  # =====================================================
  # 3. BUILD ET PUBLICATION DE L'IMAGE DOCKER
  # =====================================================

  build:
    name: Build et publication Docker Hub

    if: >-
      github.ref == 'refs/heads/dev'
      && github.event_name != 'pull_request'

    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image backend
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/frenchcab-backend:${{ github.sha }} \
            -t ${{ vars.DOCKERHUB_USERNAME }}/frenchcab-backend:latest \
            .

      - name: Publier l'image sur Docker Hub
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/frenchcab-backend:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/frenchcab-backend:latest
