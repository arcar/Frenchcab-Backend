
name: MLOps - Frenchcab

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation MLOps"
        required: true
        type: choice
        options:
          - verifier
          - entrainer
          - comparer
          - activer
          - rollback
        default: verifier

      version:
        description: "Version concernee (v1, v2...)"
        required: true
        type: string
        default: "v2"

permissions:
  contents: read

# Meme groupe que cd.yml
concurrency:
  group: frenchcab-backend-production
  cancel-in-progress: false

jobs:
  mlops:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Executer MLOps sur la VM
        uses: appleboy/ssh-action@v1

        env:
          OPERATION: ${{ inputs.operation }}
          VERSION: ${{ inputs.version }}

        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}

          envs: OPERATION,VERSION
          command_timeout: 110m

          script: |
            set -eu
            cd /home/groupe2/frenchcab

            echo "=== MLOPS FRENCHCAB ==="
            echo "Operation : $OPERATION"
            echo "Version : $VERSION"

            # Valider la version avant utilisation
            case "$VERSION" in
              v[1-9]*)
                if ! echo "$VERSION" |
                  grep -Eq '^v[1-9][0-9]*$'; then
                  echo "Version invalide"
                  exit 1
                fi
                ;;
              *)
                echo "Version invalide"
                exit 1
                ;;
            esac

            # Variables de configuration Docker
            ML_DIR=/ml
            MODELS_DIR=/ml/modeles

            # Verifier la disponibilite du backend
            docker compose exec -T backend test -d /app/ml

            # Controle HTTP apres changement de modele
            verifier_api() {
              attendu="$1"

              for tentative in $(seq 1 20); do
                reponse=$(curl -fsS --max-time 5 \
                  http://127.0.0.1:3001/modele/version \
                  2>/dev/null) || reponse=""

                echo "API : $reponse"

                if echo "$reponse" |
                  grep -Fq "\"version\":\"$attendu\""; then
                  echo "Version $attendu confirmee par l'API"
                  return 0
                fi

                echo "Attente du backend : $tentative/20"
                sleep 3
              done

              echo "ERREUR : version attendue non confirmee"
              docker compose logs --tail=50 backend
              return 1
            }

            case "$OPERATION" in

              verifier)
                echo "=== VERSIONS DISPONIBLES ==="

                docker compose exec -T backend \
                  ls -la "$MODELS_DIR"

                echo "=== MODELE DE PRODUCTION ==="

                docker compose exec -T backend \
                  sha256sum /ml/modele_temps_trajet.pkl

                echo "=== VERSION CHARGEE PAR L'API ==="

                curl -fsS \
                  http://127.0.0.1:3001/modele/version
                ;;

              entrainer)
                echo "=== ENTRAINEMENT ==="

                docker compose exec -T \
                  -e MODELS_DIR="$MODELS_DIR" \
                  backend python /app/ml/entrainement.py

                echo "=== ENTRAINEMENT TERMINE ==="
                ;;

              comparer)
                echo "=== COMPARAISON ==="

                docker compose exec -T \
                  -e MODELS_DIR="$MODELS_DIR" \
                  -e EVALUATION_DATA_PATH=/raw_data/yellow_tripdata_2026-04.parquet \
                  backend python /app/ml/MLO.py \
                    --candidate "$VERSION" \
                    --seuil 6

                echo "=== RAPPORT ==="

                docker compose exec -T backend \
                  cat /ml/modeles/resultats_comparaison.json
                ;;

              activer)
                echo "=== ACTIVATION ==="

                # Protection temporaire : ne pas activer
                # tant que l'integration n'est pas validee.
                echo "Activation en attente des tests."
                exit 1

                # Commandes prevues apres validation :
                # docker compose exec -T \
                #   -e ML_DIR="$ML_DIR" \
                #   -e MODELS_DIR="$MODELS_DIR" \
                #   backend python /app/ml/publier_modele.py \
                #     --version "$VERSION"
                #
                # docker compose restart backend
                # verifier_api "$VERSION"
                ;;

              rollback)
                echo "=== ROLLBACK ==="

                # Protection temporaire
                echo "Rollback en attente des tests."
                exit 1

                # Commandes prevues apres validation :
                # docker compose exec -T \
                #   -e ML_DIR="$ML_DIR" \
                #   -e MODELS_DIR="$MODELS_DIR" \
                #   backend python /app/ml/rollback_modele.py
                #
                # docker compose restart backend
                #
                # Lire la version restauree puis
                # appeler verifier_api avec cette version.
                ;;

              *)
                echo "Operation inconnue : $OPERATION"
                exit 1
                ;;
            esac

            echo ""
            echo "=== OPERATION MLOPS TERMINEE ==="
