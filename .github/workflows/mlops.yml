
name: MLOps - Frenchcab

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Opération MLOps à effectuer"
        required: true
        type: choice
        options:
          - pipeline
          - verifier
          - entrainer
          - comparer
          - initialiser
          - activer
          - rollback
        default: pipeline

      version:
        description: "Version candidate à comparer ou à activer"
        required: true
        type: string
        default: "v2"

      version_actuelle:
        description: "Version de référence pour la comparaison"
        required: true
        type: string
        default: "v1"

permissions:
  contents: read

# Empêche une CD et une opération MLOps
# de modifier la production simultanément.
concurrency:
  group: frenchcab-backend-production
  cancel-in-progress: false

jobs:
  mlops:
    name: Gestion des versions ML
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Exécuter l'opération MLOps sur la VM
        uses: appleboy/ssh-action@v1

        env:
          OPERATION: ${{ inputs.operation }}
          VERSION: ${{ inputs.version }}
          VERSION_ACTUELLE: ${{ inputs.version_actuelle }}

        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          envs: OPERATION,VERSION,VERSION_ACTUELLE
          command_timeout: 110m

          script: |
            set -eu

            cd /home/groupe2/frenchcab

            echo "=================================="
            echo "MLOPS FRENCHCAB"
            echo "Opération : $OPERATION"
            echo "Version candidate : $VERSION"
            echo "Version référence : $VERSION_ACTUELLE"
            echo "=================================="

            # ==========================================
            # CONFIGURATION
            # ==========================================

            ML_DIR=/ml
            MODELS_DIR=/ml/modeles
            DONNEES=/raw_data/yellow_tripdata_2026-04.parquet
            SEUIL=6

            # ==========================================
            # VALIDATION DES PARAMETRES
            # ==========================================

            printf '%s\n' "$VERSION" |
              grep -Eq '^v[1-9][0-9]*$' || {
                echo "Version candidate invalide."
                exit 1
              }

            printf '%s\n' "$VERSION_ACTUELLE" |
              grep -Eq '^v[1-9][0-9]*$' || {
                echo "Version de référence invalide."
                exit 1
              }

            # ==========================================
            # FONCTIONS COMMUNES
            # ==========================================

            verifier_api() {
              attendu="$1"
              tentative=1

              echo "Vérification de l'API pour $attendu"

              while [ "$tentative" -le 20 ]; do

                reponse=$(curl -fsS \
                  http://127.0.0.1:3001/modele/version \
                  2>/dev/null || true)

                if printf '%s' "$reponse" |
                    grep -Eq "\"version\"[[:space:]]*:[[:space:]]*\"$attendu\""; then

                  echo "API OK - Modèle chargé : $attendu"
                  return 0

                fi

                echo "Tentative $tentative/20"

                sleep 3
                tentative=$((tentative + 1))
              done

              echo "ECHEC : l'API ne confirme pas la version $attendu"
              return 1
            }

            verifier_fichiers() {
              echo "=== VERIFICATION DES FICHIERS ==="

              docker compose exec -T backend \
                test -f "$MODELS_DIR/$VERSION_ACTUELLE/model.pkl"

              docker compose exec -T backend \
                test -f "$MODELS_DIR/$VERSION/model.pkl"

              docker compose exec -T backend \
                test -f "$DONNEES"

              echo "Modèles et données présents."
            }

            comparer_modeles() {
              echo "=== COMPARAISON DES MODELES ==="

              if [ "$VERSION_ACTUELLE" = "$VERSION" ]; then
                echo "Les versions doivent être différentes."
                exit 1
              fi

              docker compose exec -T \
                -e MODELS_DIR="$MODELS_DIR" \
                backend python -m ml.MLO \
                  --actuelle "$VERSION_ACTUELLE" \
                  --candidate "$VERSION" \
                  --seuil "$SEUIL" \
                  --donnees "$DONNEES"

              echo "=== RAPPORT DE COMPARAISON ==="

              docker compose exec -T backend \
                cat "$MODELS_DIR/resultats_comparaison.json"
            }

            version_active() {
              docker compose exec -T backend python -c '
            import json
            from pathlib import Path

            chemin = Path("/ml/modeles/version_active.json")
            etat = json.loads(chemin.read_text())
            print(etat["version"])
            '
            }

            decision_promotion() {
              docker compose exec -T backend python -c '
            import json
            from pathlib import Path

            chemin = Path("/ml/modeles/resultats_comparaison.json")
            rapport = json.loads(chemin.read_text())

            actuel = rapport["actuelle"]
            candidat = rapport["candidate"]

            if (
                actuel["conforme"]
                and candidat["conforme"]
                and candidat["mae_minutes"] <= actuel["mae_minutes"]
            ):
                print("ACCEPTE")
            else:
                print("REFUS")
            '
            }

            initialiser_v1() {
              echo "=== INITIALISATION DE V1 ==="

              docker compose exec -T \
                -e ML_DIR="$ML_DIR" \
                -e MODELS_DIR="$MODELS_DIR" \
                backend python -m ml.publier_modele \
                  --version v1 \
                  --initialiser

              echo "=== REDEMARRAGE DU BACKEND ==="

              docker compose restart backend

              verifier_api "v1"

              echo "V1 initialisée avec succès."
            }

            activer_version() {
              version_cible="$1"

              echo "=== ACTIVATION DE $version_cible ==="

              docker compose exec -T \
                -e ML_DIR="$ML_DIR" \
                -e MODELS_DIR="$MODELS_DIR" \
                backend python -m ml.publier_modele \
                  --version "$version_cible"

              echo "=== REDEMARRAGE DU BACKEND ==="

              docker compose restart backend

              verifier_api "$version_cible"

              echo "Version $version_cible activée avec succès."
            }

            # ==========================================
            # CONTROLE DU CONTENEUR
            # ==========================================

            echo "=== ETAT DU BACKEND ==="

            docker compose ps backend

            docker compose exec -T backend \
              test -d /app/ml

            # ==========================================
            # OPERATIONS MLOPS
            # ==========================================

            case "$OPERATION" in

              # ----------------------------------------
              # PIPELINE COMPLET
              # ----------------------------------------

              pipeline)
                echo "=== PIPELINE MLOPS ==="

                verifier_fichiers

                comparer_modeles

                echo "=== CONTROLE QUALITE ==="

                DECISION=$(decision_promotion)

                echo "Décision pour $VERSION : $DECISION"

                echo "=== VERIFICATION VERSION ACTIVE ==="

                if ! docker compose exec -T backend \
                    test -f "$MODELS_DIR/version_active.json"; then

                  echo "Aucune version initialisée."

                  if [ "$VERSION_ACTUELLE" != "v1" ]; then
                    echo "Initialisation impossible : version attendue v1."
                    exit 1
                  fi

                  # Première mise en service :
                  # initialisation de V1 uniquement.
                  initialiser_v1

                  echo "Le candidat n'est pas activé lors de la première initialisation."

                else

                  ACTIVE=$(version_active)

                  echo "Version active : $ACTIVE"

                  if [ "$ACTIVE" != "$VERSION_ACTUELLE" ]; then
                    echo "ERREUR : version active différente de la référence."
                    echo "Active : $ACTIVE"
                    echo "Référence : $VERSION_ACTUELLE"
                    exit 1
                  fi

                  if [ "$DECISION" = "ACCEPTE" ]; then

                    echo "Candidat accepté."

                    activer_version "$VERSION"

                  else

                    echo "Candidat refusé : conservation de $ACTIVE."

                    verifier_api "$ACTIVE"

                  fi
                fi

                echo "=== PIPELINE MLOPS TERMINE ==="
                ;;

              # ----------------------------------------
              # VERIFIER
              # ----------------------------------------

              verifier)
                echo "=== VERSIONS DISPONIBLES ==="

                docker compose exec -T backend \
                  python -c "from pathlib import Path; d=Path('/ml/modeles'); print([p.name for p in d.glob('v[0-9]*') if (p/'model.pkl').is_file()])"

                echo "=== FICHIER DE VERSION ACTIVE ==="

                if docker compose exec -T backend \
                    test -f "$MODELS_DIR/version_active.json"; then

                  docker compose exec -T backend \
                    cat "$MODELS_DIR/version_active.json"

                  echo "=== VERSION CHARGEE PAR L'API ==="

                  curl -fsS \
                    http://127.0.0.1:3001/modele/version

                  echo ""

                else
                  echo "Aucune version initialisée."
                fi
                ;;

              # ----------------------------------------
              # ENTRAINER
              # ----------------------------------------

              entrainer)
                echo "=== ENTRAINEMENT ==="

                docker compose exec -T \
                  -e MODELS_DIR="$MODELS_DIR" \
                  backend python -m ml.entrainement

                echo "Entraînement terminé."
                echo "Aucune activation automatique."
                ;;

              # ----------------------------------------
              # COMPARER
              # ----------------------------------------

              comparer)
                verifier_fichiers
                comparer_modeles
                ;;

              # ----------------------------------------
              # INITIALISER V1
              # ----------------------------------------

              initialiser)
                if docker compose exec -T backend \
                    test -f "$MODELS_DIR/version_active.json"; then

                  echo "Une version est déjà initialisée."
                  echo "Initialisation refusée."
                  exit 1
                fi

                initialiser_v1
                ;;

              # ----------------------------------------
              # ACTIVER UNE VERSION
              # ----------------------------------------

              activer)
                activer_version "$VERSION"
                ;;

              # ----------------------------------------
              # ROLLBACK
              # ----------------------------------------

              rollback)
                echo "=== ROLLBACK ==="

                VERSION_RESTAUREE=$(docker compose exec -T backend \
                  python -c "import json; print(json.load(open('/ml/modeles/version_active.json'))['precedente'] or '')")

                if [ -z "$VERSION_RESTAUREE" ]; then
                  echo "Rollback impossible : aucune version précédente."
                  exit 1
                fi

                docker compose exec -T \
                  -e ML_DIR="$ML_DIR" \
                  -e MODELS_DIR="$MODELS_DIR" \
                  backend python -m ml.rollback_modele

                echo "=== REDEMARRAGE DU BACKEND ==="

                docker compose restart backend

                verifier_api "$VERSION_RESTAUREE"

                echo "Rollback réussi : $VERSION_RESTAUREE"
                ;;

              # ----------------------------------------
              # OPERATION INCONNUE
              # ----------------------------------------

              *)
                echo "Opération inconnue : $OPERATION"
                exit 1
                ;;

            esac
