
name: Continuous Deployment - Backend

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - dev

permissions:
  contents: read

# Eviter deux operations simultanees sur la VM
concurrency:
  group: frenchcab-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    # Conserver le declenchement existant :
    # CI reussie et lancee manuellement sur dev
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.head_branch == 'dev'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deployer Frenchcab sur la VM
        uses: appleboy/ssh-action@v1

        env:
          BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/frenchcab-backend:${{ github.event.workflow_run.head_sha }}

        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          envs: BACKEND_IMAGE
          command_timeout: 15m

          script: |
            set -eu

            cd /home/groupe2/frenchcab

            echo "=== DEPLOIEMENT DOCKER ==="
            echo "Image backend : $BACKEND_IMAGE"

            # Script de deploiement deja present sur la VM
            bash ./deploy.sh

            echo "=== VERIFICATION DU BACKEND ==="

            # Attendre que FastAPI soit pret apres
            # le demarrage ou le rechargement du modele.
            backend_pret=0

            for tentative in $(seq 1 20); do
              if curl -fsS --max-time 5 \
                http://127.0.0.1:3001/test; then
                backend_pret=1
                break
              fi

              echo "Backend indisponible - tentative $tentative/20"
              sleep 3
            done

            if [ "$backend_pret" -ne 1 ]; then
              echo "ERREUR : le backend ne repond pas."
              docker compose ps
              docker compose logs --tail=50 backend
              exit 1
            fi

            echo ""
            echo "=== DEPLOIEMENT TERMINE AVEC SUCCES ==="
