
name: Continuous Deployment - Backend

# Déclenchement explicite depuis ci.yml
# après réussite des tests et publication Docker Hub.
on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "SHA du commit correspondant à l'image Docker"
        required: true
        type: string

permissions:
  contents: read

# Empêche plusieurs déploiements ou opérations MLOps
# simultanés sur la VM.
concurrency:
  group: frenchcab-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement du backend sur la VM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Déployer Frenchcab sur la VM
        uses: appleboy/ssh-action@v1

        env:
          BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/frenchcab-backend:${{ inputs.image_sha }}

        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}

          envs: BACKEND_IMAGE
          command_timeout: 15m

          script: |
            set -eu

            echo "=== DEPLOIEMENT DOCKER ==="
            echo "Image backend : $BACKEND_IMAGE"

            cd /home/groupe2/frenchcab

            # Déployer l'image exacte publiée par la CI
            bash ./deploy.sh

            echo "=== VERIFICATION DU BACKEND ==="

            backend_pret=0

            for tentative in $(seq 1 20); do

              if curl -fsS --max-time 5 \
                http://127.0.0.1:3001/test; then

                backend_pret=1
                break

              fi

              echo "Backend indisponible - tentative $tentative/20"
              sleep 3

            done

            if [ "$backend_pret" -ne 1 ]; then

              echo "ERREUR : le backend ne répond pas."

              docker compose ps

              docker compose logs --tail=50 backend

              exit 1
            fi

            echo ""
            echo "=== VERIFICATION DU MODELE ACTIF ==="

            # Vérification complémentaire :
            # le déploiement doit conserver la version ML active.
            if ! curl -fsS --max-time 15 \
              http://127.0.0.1:3001/modele/version; then

              echo "ERREUR : impossible de vérifier le modèle actif."

              docker compose logs --tail=50 backend

              exit 1
            fi

            echo ""
            echo "=== DEPLOIEMENT TERMINE AVEC SUCCES ==="
